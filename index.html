<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hermes WebXR</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02051c}</style>
</head>
<body>
<a-scene renderer="antialias:true; colorManagement:true; physicallyCorrectLights:true"
 xr-mode-ui="enabled:true" background="color:#02051c">
 <a-assets timeout="120000">
  <a-asset-item id="hermesModel" src="919.3.glb"></a-asset-item>
  <img id="nebula" src="nebula.png" crossorigin="anonymous">
 </a-assets>
 <a-sky src="#nebula" rotation="0 -90 0"></a-sky>
 <a-entity gltf-model="#hermesModel" position="0 0 -4"></a-entity>

 <!-- brighter Lambda fill -->
 <a-entity light="type:ambient;color:#b9c8ff;intensity:1.05"></a-entity>
 <a-entity light="type:directional;color:#ffffff;intensity:1.35" position="-2 4 3" rotation="-35 -25 0"></a-entity>
 <a-entity light="type:point;color:#8870ff;intensity:2.1;distance:12;decay:1.4" position="0 1.5 -1.7"></a-entity>

 <!-- MUCH LARGER flare, centered on Lambda apex -->
 <a-entity id="lambdaFlare" position="0 1.57 -3.48">
  <a-circle radius=".58" material="shader:flat;color:#7898ff;transparent:true;opacity:.12;blending:additive;depthWrite:false"></a-circle>
  <a-circle radius=".38" position="0 0 .003" material="shader:flat;color:#a7b9ff;transparent:true;opacity:.20;blending:additive;depthWrite:false"></a-circle>
  <a-circle radius=".20" position="0 0 .006" material="shader:flat;color:#e2e8ff;transparent:true;opacity:.48;blending:additive;depthWrite:false"></a-circle>
  <a-circle radius=".075" position="0 0 .009" material="shader:flat;color:#ffffff;transparent:true;opacity:1;blending:additive;depthWrite:false"></a-circle>
  <a-plane width="2.15" height=".035" position="0 0 .012" material="shader:flat;color:#ffffff;transparent:true;opacity:.72;blending:additive;depthWrite:false"></a-plane>
  <a-plane width=".035" height="1.65" position="0 0 .014" material="shader:flat;color:#ffffff;transparent:true;opacity:.62;blending:additive;depthWrite:false"></a-plane>
  <a-plane width="1.35" height=".024" position="0 0 .016" rotation="0 0 45" material="shader:flat;color:#dce7ff;transparent:true;opacity:.46;blending:additive;depthWrite:false"></a-plane>
  <a-plane width="1.35" height=".024" position="0 0 .018" rotation="0 0 -45" material="shader:flat;color:#dce7ff;transparent:true;opacity:.46;blending:additive;depthWrite:false"></a-plane>
 </a-entity>
 <a-camera position="0 0 0"></a-camera>
</a-scene>
</body>
</html>
