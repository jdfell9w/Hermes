<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hermes WebXR</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02051c}</style>

<script>
AFRAME.registerComponent('apex-follow-flare', {
  init: function () {
    this.anchor = null;
    this.flare = document.querySelector('#lambdaFlare');
    this.worldPos = new THREE.Vector3();

    this.el.addEventListener('model-loaded', () => {
      const root = this.el.getObject3D('mesh');
      this.anchor = root && root.getObjectByName('Lamda_flare_core');
      if (!this.anchor) console.error('Lamda_flare_core not found');
    });
  },
  tick: function () {
    if (!this.anchor || !this.flare) return;

    // Read the TRUE exported apex position every frame.
    this.anchor.getWorldPosition(this.worldPos);

    // Flare is a real A-Frame scene entity, so it renders reliably.
    this.flare.object3D.position.copy(this.worldPos);

    // Keep the starburst facing the active camera/headset.
    const cam = this.el.sceneEl.camera;
    if (cam) this.flare.object3D.quaternion.copy(cam.quaternion);
  }
});
</script>
</head>

<body>
<a-scene renderer="antialias:true;colorManagement:true;physicallyCorrectLights:true"
         xr-mode-ui="enabled:true"
         background="color:#02051c">

  <a-assets timeout="120000">
    <a-asset-item id="hermesModel" src="919.3.glb?v=10"></a-asset-item>
    <img id="nebula" src="nebula.png?v=10" crossorigin="anonymous">
  </a-assets>

  <!-- Preserve the cobalt nebula -->
  <a-sky src="#nebula" rotation="0 -90 0"></a-sky>

  <!-- Model; component reads Lamda_flare_core from inside this GLB -->
  <a-entity id="model"
            gltf-model="#hermesModel"
            apex-follow-flare
            position="0 0 -4">
  </a-entity>

  <!-- DRAMATIC Lambda brightening.
       Strong frontal white fill + saturated violet fills. -->
  <a-entity light="type:ambient;color:#c9d2ff;intensity:1.65"></a-entity>

  <a-entity light="type:directional;color:#ffffff;intensity:3.0"
            position="-1 4 4"
            rotation="-28 -12 0">
  </a-entity>

  <a-entity light="type:point;color:#9b72ff;intensity:9.0;distance:10;decay:1.25"
            position="-0.72 3.05 -2.15">
  </a-entity>

  <a-entity light="type:point;color:#d4c4ff;intensity:5.0;distance:8;decay:1.35"
            position="-0.72 2.15 -1.65">
  </a-entity>

  <!-- LARGE reference-style flare.
       Its position is overwritten every frame by the exact GLB apex anchor. -->
  <a-entity id="lambdaFlare" position="0 0 -20">

    <!-- broad soft glow -->
    <a-circle radius="0.56" position="0 0 0"
      material="shader:flat;color:#688cff;transparent:true;opacity:.10;blending:additive;depthWrite:false;side:double">
    </a-circle>
    <a-circle radius="0.36" position="0 0 .003"
      material="shader:flat;color:#9fb7ff;transparent:true;opacity:.17;blending:additive;depthWrite:false;side:double">
    </a-circle>
    <a-circle radius="0.19" position="0 0 .006"
      material="shader:flat;color:#e2e9ff;transparent:true;opacity:.45;blending:additive;depthWrite:false;side:double">
    </a-circle>
    <a-circle radius="0.067" position="0 0 .010"
      material="shader:flat;color:#ffffff;transparent:true;opacity:1;blending:additive;depthWrite:false;side:double">
    </a-circle>

    <!-- long starburst rays -->
    <a-plane width="2.05" height=".027" position="0 0 .014"
      material="shader:flat;color:#ffffff;transparent:true;opacity:.76;blending:additive;depthWrite:false;side:double">
    </a-plane>
    <a-plane width=".027" height="1.58" position="0 0 .016"
      material="shader:flat;color:#ffffff;transparent:true;opacity:.72;blending:additive;depthWrite:false;side:double">
    </a-plane>
    <a-plane width="1.08" height=".019" position="0 0 .018" rotation="0 0 45"
      material="shader:flat;color:#e7edff;transparent:true;opacity:.48;blending:additive;depthWrite:false;side:double">
    </a-plane>
    <a-plane width="1.08" height=".019" position="0 0 .020" rotation="0 0 -45"
      material="shader:flat;color:#e7edff;transparent:true;opacity:.48;blending:additive;depthWrite:false;side:double">
    </a-plane>
  </a-entity>

  <a-camera position="0 0 0"></a-camera>
</a-scene>
</body>
</html>
