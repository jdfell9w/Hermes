<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>919 — Quest WebXR</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;background:#020716;overflow:hidden}
#status{position:fixed;left:10px;bottom:10px;z-index:10;color:white;background:#0009;
padding:7px 10px;border-radius:8px;font:12px system-ui}
</style>
<script>
AFRAME.registerComponent('quest-locomotion',{
  schema:{speed:{default:2.0},snap:{default:30}},
  init:function(){
    this.left={x:0,y:0}; this.right={x:0,y:0}; this.ready=true;
    const L=document.querySelector('#leftHand'), R=document.querySelector('#rightHand');
    const axis=(side,e)=>{
      const a=e.detail.axis||[], n=a.length;
      if(n>=2){
        const x=a[n-2]||0, y=a[n-1]||0;
        if(side==='L'){this.left.x=x;this.left.y=y}
        else {this.right.x=x;this.right.y=y}
      }
    };
    L.addEventListener('axismove',e=>axis('L',e));
    R.addEventListener('axismove',e=>axis('R',e));
  },
  tick:function(time,dt){
    if(!dt)return;
    const rig=this.el.object3D, cam=document.querySelector('#camera').object3D;
    const dead=.18, s=this.data.speed*(dt/1000);
    const x=Math.abs(this.left.x)>dead?this.left.x:0;
    const y=Math.abs(this.left.y)>dead?this.left.y:0;
    if(x||y){
      const dir=new THREE.Vector3(); cam.getWorldDirection(dir); dir.y=0;
      if(dir.lengthSq()>0)dir.normalize();
      const right=new THREE.Vector3().crossVectors(dir,new THREE.Vector3(0,1,0)).normalize();
      rig.position.addScaledVector(dir,-y*s);
      rig.position.addScaledVector(right,x*s);
    }
    const rx=Math.abs(this.right.x)>.72?this.right.x:0;
    if(rx&&this.ready){
      rig.rotation.y-=THREE.MathUtils.degToRad(this.data.snap)*Math.sign(rx);
      this.ready=false;
    }
    if(Math.abs(this.right.x)<.35)this.ready=true;
  }
});

AFRAME.registerComponent('model-finish',{
  init:function(){
    this.anchor=null;
    this.flare=document.querySelector('#lambdaFlare');
    this.p=new THREE.Vector3();
    this.el.addEventListener('model-loaded',()=>{
      const root=this.el.getObject3D('mesh');
      this.anchor=root && root.getObjectByName('Lamda_flare_core');

      // Actual GLB inspection identifies Text.003 as the lower phrase.
      const phrase=root && root.getObjectByName('Text.003');
      if(phrase && phrase.isMesh){
        const purple=new THREE.MeshStandardMaterial({
          color:0x6f20a8, metalness:.48, roughness:.22
        });
        phrase.material=purple;

        // Gold shell just outside the purple mesh: visible as a bevel/rim.
        const gold=new THREE.MeshStandardMaterial({
          color:0xd7a521, metalness:.95, roughness:.16,
          side:THREE.BackSide
        });
        const rim=new THREE.Mesh(phrase.geometry,gold);
        rim.scale.set(1.035,1.035,1.035);
        phrase.add(rim);
      }
    });
  },
  tick:function(){
    if(!this.anchor||!this.flare)return;
    this.anchor.getWorldPosition(this.p);
    this.flare.object3D.position.copy(this.p);
    const cam=this.el.sceneEl.camera;
    if(cam)this.flare.object3D.quaternion.copy(cam.quaternion);
  }
});

AFRAME.registerComponent('earth-slow-rotate',{
 schema:{period:{default:180}},
 init:function(){
  this.pivot=null;
  this.el.addEventListener('model-loaded',()=>{
   const root=this.el.getObject3D('mesh');
   const earth=root && root.getObjectByName('Sphere');
   if(!earth || !earth.parent){
    console.error('Earth node Sphere not found');
    return;
   }

   // Insert a pivot at Earth's exported origin without changing its appearance.
   const parent=earth.parent;
   const pivot=new THREE.Group();
   pivot.name='Earth_WebXR_Rotation_Pivot';
   pivot.position.copy(earth.position);
   pivot.quaternion.copy(earth.quaternion);
   parent.add(pivot);

   // Preserve scale on Earth; move position/orientation responsibility to pivot.
   earth.position.set(0,0,0);
   earth.quaternion.identity();
   pivot.add(earth);

   this.pivot=pivot;
  });
 },
 tick:function(t,dt){
  if(!this.pivot || !dt) return;
  this.pivot.rotateY((Math.PI*2)*(dt/1000)/this.data.period);
 }
});

AFRAME.registerComponent('model-status',{
 init:function(){
   const s=document.querySelector('#status');
   this.el.addEventListener('model-loaded',()=>{
     s.textContent='919 loaded — enter VR';
     setTimeout(()=>s.style.display='none',3000)
   });
   this.el.addEventListener('model-error',()=>{s.textContent='919.3.glb failed to load'});
 }
});
</script>
</head>
<body>
<div id="status">Loading 919.3.glb…</div>

<a-scene
  background="color:#020716"
  renderer="antialias:true; colorManagement:true; physicallyCorrectLights:true"
  vr-mode-ui="enabled:true">

  <a-assets timeout="120000">
    <a-asset-item id="aasbModel" src="919.3.glb?v=14"></a-asset-item>
    <!-- Exact supplied 1536x768 cobalt nebula image. -->
    <img id="nebulaTexture" src="nebula.png?v=12" crossorigin="anonymous">
  </a-assets>

  <a-entity id="aasb" gltf-model="#aasbModel" position="0 0 0" model-status model-finish earth-slow-rotate="period:180"></a-entity>

  <!-- Actual supplied nebula image on the inside of the environment sphere.
       Flat/unlit so WebXR lighting cannot wash out its cobalt/black contrast. -->
  <a-sphere id="nebulaBackground"
    radius="80"
    segments-width="96"
    segments-height="64"
    rotation="0 -90 0"
    material="shader:flat; src:#nebulaTexture; side:back; color:#ffffff; fog:false">
  </a-sphere>

  <a-entity id="lambdaFlare" position="0 0 -20">
    <a-circle radius=".56" material="shader:flat;color:#688cff;transparent:true;opacity:.10;blending:additive;depthWrite:false;side:double"></a-circle>
    <a-circle radius=".36" position="0 0 .003" material="shader:flat;color:#9fb7ff;transparent:true;opacity:.17;blending:additive;depthWrite:false;side:double"></a-circle>
    <a-circle radius=".19" position="0 0 .006" material="shader:flat;color:#e2e9ff;transparent:true;opacity:.45;blending:additive;depthWrite:false;side:double"></a-circle>
    <a-circle radius=".067" position="0 0 .010" material="shader:flat;color:#ffffff;transparent:true;opacity:1;blending:additive;depthWrite:false;side:double"></a-circle>
    <a-plane width="2.05" height=".027" position="0 0 .014" material="shader:flat;color:#ffffff;transparent:true;opacity:.76;blending:additive;depthWrite:false;side:double"></a-plane>
    <a-plane width=".027" height="1.58" position="0 0 .016" material="shader:flat;color:#ffffff;transparent:true;opacity:.72;blending:additive;depthWrite:false;side:double"></a-plane>
    <a-plane width="1.08" height=".019" position="0 0 .018" rotation="0 0 45" material="shader:flat;color:#e7edff;transparent:true;opacity:.48;blending:additive;depthWrite:false;side:double"></a-plane>
    <a-plane width="1.08" height=".019" position="0 0 .020" rotation="0 0 -45" material="shader:flat;color:#e7edff;transparent:true;opacity:.48;blending:additive;depthWrite:false;side:double"></a-plane>
  </a-entity>

  <a-entity light="type:ambient; color:#c9d2ff; intensity:1.35"></a-entity>
  <a-entity light="type:directional; color:#ffffff; intensity:2.4" position="-3 5 6"></a-entity>
  <a-entity light="type:directional; color:#b5c5ff; intensity:1.25" position="4 2 5"></a-entity>
  <a-entity light="type:point; color:#9b72ff; intensity:8.0; distance:8; decay:1.3" position="-0.72 3.0 2.0"></a-entity>

  <a-entity id="rig" position="0 0 8" quest-locomotion="speed:2.0; snap:30">
    <a-camera id="camera" position="0 1.6 0" look-controls wasd-controls="acceleration:20"></a-camera>
    <a-entity id="leftHand" hand-controls="hand:left; handModelStyle:lowPoly; color:#ffffff"></a-entity>
    <a-entity id="rightHand" hand-controls="hand:right; handModelStyle:lowPoly; color:#ffffff"></a-entity>
  </a-entity>
</a-scene>
</body>
</html>
