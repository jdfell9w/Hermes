<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>919 — Quest WebXR</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;background:#06122c;overflow:hidden}
#status{position:fixed;left:10px;bottom:10px;z-index:10;color:white;background:#0009;
padding:7px 10px;border-radius:8px;font:12px system-ui}
</style>
<script>
/* Quest thumbstick locomotion without aframe-extras.
   Left stick = move/strafe. Right stick = snap turn. */
AFRAME.registerComponent('quest-locomotion',{
  schema:{speed:{default:2.0},snap:{default:30}},
  init:function(){
    this.left={x:0,y:0}; this.right={x:0,y:0}; this.ready=true;
    const L=document.querySelector('#leftHand'), R=document.querySelector('#rightHand');
    const axis=(side,e)=>{
      const a=e.detail.axis || [];
      // WebXR controllers commonly report thumbstick as the last axis pair.
      const n=a.length;
      if(n>=2){
        const x=a[n-2]||0, y=a[n-1]||0;
        if(side==='L'){this.left.x=x;this.left.y=y}
        else {this.right.x=x;this.right.y=y}
      }
    };
    L.addEventListener('axismove',e=>axis('L',e));
    R.addEventListener('axismove',e=>axis('R',e));
  },
  tick:function(time,dt){
    if(!dt) return;
    const rig=this.el.object3D;
    const cam=document.querySelector('#camera').object3D;
    const dead=.18, s=this.data.speed*(dt/1000);
    let x=Math.abs(this.left.x)>dead?this.left.x:0;
    let y=Math.abs(this.left.y)>dead?this.left.y:0;
    if(x||y){
      const dir=new THREE.Vector3();
      cam.getWorldDirection(dir); dir.y=0;
      if(dir.lengthSq()>0) dir.normalize();
      const right=new THREE.Vector3().crossVectors(dir,new THREE.Vector3(0,1,0)).normalize();
      rig.position.addScaledVector(dir,-y*s);
      rig.position.addScaledVector(right,x*s);
    }
    const rx=Math.abs(this.right.x)>0.72?this.right.x:0;
    if(rx && this.ready){
      rig.rotation.y -= THREE.MathUtils.degToRad(this.data.snap)*Math.sign(rx);
      this.ready=false;
    }
    if(Math.abs(this.right.x)<.35) this.ready=true;
  }
});

AFRAME.registerComponent('model-status',{
 init:function(){
   const s=document.querySelector('#status');
   this.el.addEventListener('model-loaded',()=>{s.textContent='919 loaded — enter VR';setTimeout(()=>s.style.display='none',3000)});
   this.el.addEventListener('model-error',()=>{s.textContent='919.3.glb failed to load'});
 }
});
</script>
</head>
<body>
<div id="status">Loading 919.3.glb…</div>

<a-scene
  background="color:#06132f"
  renderer="antialias:true; colorManagement:true; physicallyCorrectLights:true"
  vr-mode-ui="enabled:true">

  <a-assets timeout="120000">
    <a-asset-item id="aasbModel" src="919.3.glb?v=4"></a-asset-item>
  </a-assets>

  <!-- Blender model only. No sprite flare: eliminates stereo conflict. -->
  <a-entity id="aasb" gltf-model="#aasbModel" position="0 0 0" model-status></a-entity>

  <!-- Stereo-safe 3D background, no stars -->
  <a-sphere id="blueBackground" radius="80"
    material="shader:standard; color:#071a46; roughness:1; metalness:0; side:back; fog:false">
  </a-sphere>

  <!-- Stereo-safe world-space flare test at lambda apex -->
  <a-entity id="lambdaFlare" position="0 2.72 0.05">
    <a-sphere radius="0.035"
      material="shader:flat; color:#fff3c4; emissive:#ffd36a; emissiveIntensity:3; transparent:true; opacity:0.95">
    </a-sphere>
    <a-sphere radius="0.09"
      material="shader:flat; color:#ffd36a; emissive:#ffb52e; emissiveIntensity:2; transparent:true; opacity:0.18; depthWrite:false">
    </a-sphere>
  </a-entity>

  <!-- Brighter neutral lighting -->
  <a-entity light="type:ambient; color:#d5ddff; intensity:0.9"></a-entity>
  <a-entity light="type:directional; color:#ffffff; intensity:1.25" position="-3 5 6"></a-entity>
  <a-entity light="type:directional; color:#b5c5ff; intensity:0.75" position="4 2 5"></a-entity>

  <!-- One XR camera only. Headset supplies the two stereo eye views. -->
  <a-entity id="rig" position="0 0 8" quest-locomotion="speed:2.0; snap:30">
    <a-camera id="camera" position="0 1.6 0" look-controls wasd-controls="acceleration:20"></a-camera>

    <!-- Actual tracked Quest controllers -->
    <a-entity id="leftHand"
      hand-controls="hand:left; handModelStyle:lowPoly; color:#ffffff">
    </a-entity>
    <a-entity id="rightHand"
      hand-controls="hand:right; handModelStyle:lowPoly; color:#ffffff">
    </a-entity>
  </a-entity>

</a-scene>
</body>
</html>
